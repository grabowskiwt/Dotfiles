[main]
font=JetBrainsMono Nerd Font Mono:size=18
font-size-adjustment=0.5
selection-target=both  # Select to copy

# Environment
term=xterm-256color
dpi-aware=yes
pad=8x8

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
cursor=282828 ebdbb2
alpha=1.0
background=282828
foreground=ebdbb2
selection-foreground=ebdbb2
selection-background=504945
                  		
regular0=282828   # black
regular1=cc241d   # red
regular2=689d6a   # aqua
regular3=d79921   # yellow
regular4=458588   # blue
regular5=b16286   # purple
regular6=98971a   # green
regular7=a89984   # white

bright0=928374    # bright black (gray)
bright1=fb4934    # bright red
bright2=8ec07c    # bright aqua
bright3=fabd2f    # bright yellow
bright4=83a598    # bright blue
bright5=d3869b    # bright purple
bright6=b8bb26    # bright green
bright7=ebdbb2    # bright white

16=d65d0e         # orange (dark)
17=fe8019         # orange (bright)  

[bell]
urgent=no
notify=no
visual=no

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
pipe-scrollback=[wl-copy] Control+Shift+p   # Copy whole history
search-start=Control+Shift+r        # Search mode
show-urls-launch=Control+Shift+o    # Url mode
spawn-terminal=Control+Shift+n      # New window

[scrollback]
lines=10000
multiplier=3.0

[search-bindings]
cancel=Control+g Control+c Escape
commit=Return
find-prev=Control+r
find-next=Control+s

[csd]
preferred=server    # Decorations from WM
