[main]
font=JetBrainsMono Nerd Font:size=14
dpi-aware=yes
terminal=foot -e
prompt="❯ "
layer=overlay
icon-theme=Tela-circle-green
lines=12
width=45
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=24
letter-spacing=0
fields=name,generic,comment,categories,filename
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e1eff
text=d4d4d4ff
prompt=6a9955ff
placeholder=6b6c8aff
input=d4d4d4ff
match=6a9955ff
selection=6a9955ff
selection-text=1e1e1eff
selection-match=1e1e1eff
counter=6b6c8aff
border=6a9955ff

[border]
width=5
radius=12
