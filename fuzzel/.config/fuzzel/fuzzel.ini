[main]
font=JetBrainsMono Nerd Font:size=18
dpi-aware=yes
terminal=foot -e
prompt="❯ "
layer=overlay
icon-theme=Tela-circle-green
lines=12
width=45
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=24
letter-spacing=0
fields=name,generic,comment,categories,filename
exit-on-keyboard-focus-loss=yes
placeholder=Search...

[colors]
background=282828ff
text=ebdbb2ff
prompt=689d6aff
placeholder=504945ff
input=d65d0eff
match=d65d0eff
selection=689d6aff
selection-text=282828ff
selection-match=ebdbb2ff
border=689d6aff

[border]
width=5
radius=12
